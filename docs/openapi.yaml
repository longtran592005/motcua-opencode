openapi: 3.1.0
info:
  title: "API Cổng Một cửa điện tử - Trường Đại học Thái Bình"
  version: "1.0.0"
  description: |
    Hợp đồng API giữa frontend (motcua-opencode) và backend cho Cổng dịch vụ một cửa
    điện tử của Trường Đại học Thái Bình (motcua.tbu.edu.vn).

    QUY ƯỚC PHONG BÌ (ENVELOPE):
    - Mọi endpoint trả JSON đều bọc theo `SuccessEnvelope` / `ErrorResponse`.
    - Thành công đối tượng đơn: { success: true, data: <T> }
    - Thành công danh sách: { success: true, data: [<T>], meta: { page, pageSize, total } }
    - Lỗi: HTTP status đúng + { success: false, error: { code, message, details } }
    - Các endpoint KHÔNG trả JSON (tải tệp, PDF, SSE chatbot, SSE chuông thông báo)
      KHÔNG bọc phong bì; nhưng khi lỗi vẫn trả phong bì lỗi với HTTP status đúng.

    MÃ LỖI NGHIỆP VỤ (chuỗi) nằm trong `error.code`, xem schema `ErrorCode`.
    `details` là dữ liệu bổ sung tùy lỗi (ví dụ soLanConLai, khoaDenLuc, giayToThieu).

    PHÂN BIỆT BA MÃ 409:
    - `INVALID_TRANSITION`: trạng thái HIỆN TẠI của hồ sơ/văn bản không cho phép hành động.
    - `ALREADY_PROCESSED`: bước đã được NGƯỜI KHÁC xử lý xong (tranh chấp đồng thời).
    - `DUPLICATE_ACTION`: cùng `Idempotency-Key` nhưng NỘI DUNG yêu cầu KHÁC.

    QUY TẮC `Idempotency-Key` (bắt buộc với mọi thao tác ghi nghiệp vụ):
    - Gửi lại ĐÚNG yêu cầu cũ với cùng khoá => trả lại KẾT QUẢ BAN ĐẦU (cùng HTTP status và
      body như lần đầu), KHÔNG báo lỗi, KHÔNG tạo hiệu ứng mới.
    - Cùng khoá nhưng nội dung yêu cầu khác => 409 `DUPLICATE_ACTION`.
    - Bản ghi khoá được lưu tối đa 24 giờ.
    Xem thêm `docs/QUYET_DINH.md`.

    RÀNG BUỘC ĐỊNH DANH (đã chốt):
    - Mã nghiệp vụ KHÔNG bao giờ có định dạng UUID; khi tạo, backend từ chối (VALIDATION_ERROR)
      nếu giá trị `ma`/`maSo`/`maHoSo` khớp định dạng UUID.
    - Kiểm tra quyền LUÔN theo bản ghi tìm được, không theo dạng định danh client gửi lên.
    - Mọi response trả mã nghiệp vụ (`maHoSo`, `ma`, `maSo`) làm định danh công khai.
    - API công khai chỉ nhận `token` xác thực / số văn bản, KHÔNG nhận UUID nội bộ.

    XUẤT TỆP (`GET /documents/{id}/export`):
    - Trả `url` có chữ ký, HẾT HẠN 5 PHÚT, gắn với người dùng đã yêu cầu.
    - Mỗi lần tải qua `url` được ghi vào bảng `document_downloads`.
    - KHÔNG nhúng nội dung tệp trong JSON.

    ĐỊNH DANH:
    - Khóa chính/khóa ngoại trong DB là UUID.
    - API trả thêm mã nghiệp vụ đọc được (Application.maHoSo, RequestType.ma, User.maSo,
      Khoa/PhongBan/Nganh/Lop/KhoaHoc.ma, Workflow.ma, DocumentTemplate.ma).
    - URL và form chọn dùng mã nghiệp vụ (Application.maHoSo, RequestType.ma, Workflow.ma,
      DocumentTemplate.ma, User.maSo, Khoa/PhongBan/Nganh/Lop/KhoaHoc.ma); backend tự đổi
      sang UUID nội bộ.
    - Để không phải sửa toàn bộ tầng service của frontend cùng lúc, backend cũng CHẤP NHẬN
      UUID nội bộ tại các tham số đường dẫn nêu trên (định dạng UUID không trùng với mã
      nghiệp vụ). Đây là tương thích ngược; frontend nên chuyển dần sang mã nghiệp vụ.
    - Kiểm tra quyền truy cập luôn dựa trên BẢN GHI (scope theo khoa/lớp/cố vấn/người tạo),
      không bao giờ tin định danh do client gửi lên (chống IDOR).

    QUYỀN RIÊNG TƯ (Nghị định 13/2023/NĐ-CP):
    - Mọi API công khai (tag Công khai) trả dữ liệu cá nhân đã che ở phía máy chủ
      (họ tên dạng "Nguyễn V** A", mã số dạng "2021***").
    - Không trả họ tên/MSSV/email/số điện thoại đầy đủ ở bất kỳ trường nào, kể cả
      trong thông điệp lỗi hay nhật ký.

    XÁC THỰC:
    - JWT Bearer access token (15 phút) qua header Authorization.
    - Refresh token xoay vòng lưu trong cookie httpOnly (không truy cập được bằng JS).
    - Endpoint `/auth/quick-login` chỉ dùng cho trình diễn, PHẢI tắt ở production.

    ĐỌC THÊM: docs/FRONTEND_CONTRACT.md.
servers:
  - url: /api/v1
    description: "API version 1"
tags:
  - name: "Xác thực"
    description: "Đăng nhập, phiên làm việc, refresh token"
  - name: "Hồ sơ một cửa"
    description: "Sinh viên nộp và theo dõi đơn"
  - name: "Phê duyệt"
    description: "Người xử lý duyệt/từ chối/yêu cầu bổ sung"
  - name: "Ký OTP"
    description: "Gửi và kiểm tra mã OTP khi ký số"
  - name: "Ủy quyền"
    description: "Ủy quyền duyệt tạm thời"
  - name: "Văn bản"
    description: "Văn bản đã cấp, thu hồi, xuất tệp, báo cáo"
  - name: "Mẫu văn bản"
    description: "Quản lý mẫu văn bản"
  - name: "Công khai"
    description: "Tra cứu và xác thực văn bản công khai, thư viện biểu mẫu"
  - name: "Thông báo"
    description: "Thông báo trong hệ thống"
  - name: "Nhật ký"
    description: "Nhật ký hệ thống (append-only)"
  - name: "Trợ lý ảo"
    description: "Chatbot RAG hỏi đáp thủ tục"
  - name: "Loại đơn"
    description: "Loại đơn và biểu mẫu động"
  - name: "Luồng duyệt"
    description: "Định nghĩa luồng duyệt nhiều cấp"
  - name: "Người dùng"
    description: "Quản lý người dùng và phân quyền"
  - name: "Danh mục"
    description: "Khoa, phòng ban, ngành, lớp, khóa học"
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: ["Xác thực"]
      summary: "Đăng nhập bằng mã số/email và mật khẩu"
      description: "Trả access token và thông tin người dùng; refresh token đặt trong cookie httpOnly."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginPayload' }
      responses:
        '200':
          description: "Đăng nhập thành công"
          headers:
            Set-Cookie:
              description: "Refresh token (httpOnly, Secure, SameSite=Lax)"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/quick-login:
    post:
      tags: ["Xác thực"]
      summary: "Đăng nhập nhanh theo vai trò (CHỈ TRÌNH DIỄN)"
      description: "Chỉ phục vụ bản demo. Ở production phải trả 404 hoặc 403 tùy cờ ENABLE_QUICK_LOGIN."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: "Đăng nhập nhanh thành công"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/refresh:
    post:
      tags: ["Xác thực"]
      summary: "Làm mới access token"
      description: "Đọc refresh token từ cookie httpOnly, xoay vòng và trả access token mới."
      security: []
      responses:
        '200':
          description: "Access token mới"
          headers:
            Set-Cookie:
              description: "Refresh token mới (xoay vòng)"
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [token, hetHan]
                        properties:
                          token: { type: string, description: "Access token mới" }
                          hetHan: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: ["Xác thực"]
      summary: "Lấy người dùng của phiên hiện tại"
      responses:
        '200':
          description: "Người dùng hiện tại"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: ["Xác thực"]
      summary: "Đăng xuất và thu hồi phiên"
      responses:
        '204': { description: "Đã đăng xuất" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/profile:
    patch:
      tags: ["Xác thực"]
      summary: "Cập nhật hồ sơ cá nhân"
      description: "Chỉ cho phép các trường an toàn (hoTen, soDienThoai, avatarUrl, ngaySinh, gioiTinh). Từ chối đổi role/maSo/donViId."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hoTen: { type: string }
                soDienThoai: { type: string }
                avatarUrl: { type: string }
                ngaySinh: { type: string, format: date }
                gioiTinh: { $ref: '#/components/schemas/Gender' }
      responses:
        '200':
          description: "Hồ sơ sau khi cập nhật"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /applications/mine:
    get:
      tags: ["Hồ sơ một cửa"]
      summary: "Danh sách hồ sơ của sinh viên đang đăng nhập"
      x-roles: [SINH_VIEN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/TrangThaiApp'
        - $ref: '#/components/parameters/RequestTypeId'
        - $ref: '#/components/parameters/TuKhoa'
        - $ref: '#/components/parameters/KhoaFilter'
        - $ref: '#/components/parameters/LopFilter'
        - $ref: '#/components/parameters/HanXuLy'
        - $ref: '#/components/parameters/SapXep'
      responses:
        '200':
          description: "Danh sách hồ sơ phân trang"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /applications/mine/recent:
    get:
      tags: ["Hồ sơ một cửa"]
      summary: "Vài hồ sơ gần đây của sinh viên (trừ bản nháp)"
      x-roles: [SINH_VIEN]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        '200':
          description: "Hồ sơ gần đây"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /applications/mine/stats:
    get:
      tags: ["Hồ sơ một cửa"]
      summary: "Thống kê nhanh hồ sơ của sinh viên"
      x-roles: [SINH_VIEN]
      responses:
        '200':
          description: "Thống kê cá nhân"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/MyStats' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /applications:
    post:
      tags: ["Hồ sơ một cửa"]
      summary: "Tạo bản nháp hồ sơ"
      x-roles: [SINH_VIEN]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApplicationPayload' }
      responses:
        '201':
          description: "Bản nháp đã tạo"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Application' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenScope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/DuplicateAction' }
  /applications/{maHoSo}:
    parameters:
      - $ref: '#/components/parameters/MaHoSo'
    get:
      tags: ["Hồ sơ một cửa"]
      summary: "Chi tiết hồ sơ theo mã hồ sơ"
      x-roles: [SINH_VIEN, CO_VAN, TRUONG_KHOA, PHONG_DAO_TAO, ADMIN]
      responses:
        '200':
          description: "Chi tiết hồ sơ"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/ApplicationDetail' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenScope' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: ["Hồ sơ một cửa"]
      summary: "Cập nhật bản nháp hoặc hồ sơ đang cần bổ sung"
      x-roles: [SINH_VIEN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApplicationPayload' }
      responses:
        '200':
          description: "Hồ sơ sau cập nhật"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Application' } }
        '403': { $ref: '#/components/responses/ForbiddenScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: ["Hồ sơ một cửa"]
      summary: "Xoá bản nháp hoặc hồ sơ đã rút"
      x-roles: [SINH_VIEN]
      responses:
        '204': { description: "Đã xoá" }
        '403': { $ref: '#/components/responses/ForbiddenScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /applications/{maHoSo}/submit:
    post:
      tags: ["Hồ sơ một cửa"]
      summary: "Nộp hồ sơ vào luồng duyệt"
      description: "Kiểm tra đủ trường bắt buộc và giấy tờ; thiếu giấy tờ trả MISSING_ATTACHMENT."
      x-roles: [SINH_VIEN]
      parameters:
        - $ref: '#/components/parameters/MaHoSo'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: "Hồ sơ đã nộp"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Application' } }
        '403': { $ref: '#/components/responses/ForbiddenScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/MissingAttachment' }
  /applications/{maHoSo}/cancel:
    post:
      tags: ["Hồ sơ một cửa"]
      summary: "Rút hồ sơ (chỉ khi chưa cấp nào duyệt)"
      x-roles: [SINH_VIEN]
      parameters:
        - $ref: '#/components/parameters/MaHoSo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { lyDo: { type: string, maxLength: 1000 } }
      responses:
        '200':
          description: "Hồ sơ đã rút"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Application' } }
        '403': { $ref: '#/components/responses/ForbiddenScope' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /applications/{maHoSo}/supplement:
    post:
      tags: ["Hồ sơ một cửa"]
      summary: "Bổ sung hồ sơ đang ở trạng thái Cần bổ sung"
      description: "Sau khi bổ sung, hồ sơ quay lại ĐÚNG cấp đã yêu cầu (yeuCauBoSung.quayVeBuocOrder)."
      x-roles: [SINH_VIEN]
      parameters:
        - $ref: '#/components/parameters/MaHoSo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplementInput' }
      responses:
        '200':
          description: "Hồ sơ sau bổ sung"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Application' } }
        '403': { $ref: '#/components/responses/ForbiddenScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /applications/{maHoSo}/next-approver-roles:
    get:
      tags: ["Hồ sơ một cửa"]
      summary: "Vai trò của bước duyệt kế tiếp"
      parameters:
        - $ref: '#/components/parameters/MaHoSo'
      responses:
        '200':
          description: "Danh sách vai trò chờ duyệt"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Role' }
        '404': { $ref: '#/components/responses/NotFound' }
  /approvals/pending:
    get:
      tags: ["Phê duyệt"]
      summary: "Hồ sơ đang chờ người đăng nhập xử lý"
      x-roles: [CO_VAN, TRUONG_KHOA, PHONG_DAO_TAO, ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/TrangThaiApp'
        - $ref: '#/components/parameters/RequestTypeId'
        - $ref: '#/components/parameters/TuKhoa'
        - $ref: '#/components/parameters/KhoaFilter'
        - $ref: '#/components/parameters/LopFilter'
        - $ref: '#/components/parameters/HanXuLy'
        - $ref: '#/components/parameters/SapXep'
      responses:
        '200':
          description: "Danh sách chờ duyệt"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenScope' }
  /approvals/processed:
    get:
      tags: ["Phê duyệt"]
      summary: "Hồ sơ người đăng nhập đã xử lý"
      x-roles: [CO_VAN, TRUONG_KHOA, PHONG_DAO_TAO, ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/TrangThaiApp'
        - $ref: '#/components/parameters/RequestTypeId'
        - $ref: '#/components/parameters/TuKhoa'
        - $ref: '#/components/parameters/SapXep'
