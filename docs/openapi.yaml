        '409': { $ref: '#/components/responses/InvalidTransition' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token 15 phút. Refresh token nằm trong cookie httpOnly."
  responses:
    Unauthorized:
      description: "Chưa xác thực hoặc token hết hạn"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: UNAUTHORIZED, message: "Phiên làm việc đã hết hạn." }
    ForbiddenScope:
      description: "Ngoài phạm vi được phép (chống IDOR)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: FORBIDDEN_SCOPE, message: "Bạn không có quyền truy cập hồ sơ này." }
    NotFound:
      description: "Không tìm thấy tài nguyên"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: NOT_FOUND, message: "Không tìm thấy hồ sơ." }
    ValidationError:
      description: "Dữ liệu đầu vào không hợp lệ"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: "Vui lòng hoàn thiện các trường bắt buộc."
              details: { truongThieu: ["Mục đích xác nhận", "Nơi nhận"] }
    InvalidTransition:
      description: "Trạng thái hiện tại không cho phép hành động"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: INVALID_TRANSITION, message: "Chỉ hồ sơ ở trạng thái Bản nháp mới có thể nộp." }
    DuplicateAction:
      description: "Cùng Idempotency-Key nhưng nội dung yêu cầu khác"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: DUPLICATE_ACTION, message: "Khoá idempotency đã dùng cho một yêu cầu khác." }
    AlreadyProcessed:
      description: "Bước đã được người khác xử lý xong"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: ALREADY_PROCESSED, message: "Hồ sơ đã được người khác xử lý ở bước hiện tại." }
    MissingAttachment:
      description: "Thiếu giấy tờ bắt buộc khi nộp"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error:
              code: MISSING_ATTACHMENT
              message: "Thiếu giấy tờ bắt buộc: Ảnh Căn cước công dân."
              details: { giayToThieu: [cccd] }
    OtpInvalid:
      description: "Mã OTP nhập sai"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: OTP_INVALID, message: "Mã OTP không đúng. Bạn còn 3 lần thử.", details: { soLanConLai: 3 } }
    OtpExpired:
      description: "Phiên OTP hết hạn hoặc không tồn tại"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: OTP_EXPIRED, message: "Mã OTP đã hết hiệu lực. Vui lòng gửi lại mã mới." }
    OtpLocked:
      description: "Khoá tạm do nhập sai quá số lần"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: OTP_LOCKED, message: "Chức năng ký bị tạm khoá 15 phút.", details: { khoaDenLuc: "2026-10-16T10:15:00Z" } }
    DocumentRevoked:
      description: "Văn bản đã bị thu hồi"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: DOCUMENT_REVOKED, message: "Văn bản đã bị thu hồi nên không thể tải về." }
    RateLimited:
      description: "Vượt giới hạn tần suất"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: VALIDATION_ERROR, message: "Bạn thao tác quá nhanh. Vui lòng thử lại sau." }
  parameters:
    Page:
      name: page
      in: query
      description: "Trang hiện tại, bắt đầu từ 1"
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: "Số bản ghi mỗi trang"
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    TuKhoa:
      name: tuKhoa
      in: query
      description: "Từ khoá tìm kiếm (không phân biệt dấu)"
      schema: { type: string }
    TrangThaiApp:
      name: trangThai
      in: query
      schema:
        oneOf:
          - $ref: '#/components/schemas/ApplicationStatus'
          - { type: string, enum: [ALL] }
    TrangThaiDoc:
      name: trangThai
      in: query
      schema:
        oneOf:
          - $ref: '#/components/schemas/DocumentStatus'
          - { type: string, enum: [ALL] }
    RequestTypeId:
      name: requestTypeId
      in: query
      description: "UUID loại đơn"
      schema: { type: string, format: uuid }
    KhoaFilter:
      name: khoa
      in: query
      description: "Mã hoặc tên khoa"
      schema: { type: string }
    LopFilter:
      name: lop
      in: query
      description: "Mã hoặc tên lớp"
      schema: { type: string }
    HanXuLy:
      name: hanXuLy
      in: query
      schema: { type: string, enum: [ALL, SAP_HET_HAN, QUA_HAN] }
    SapXep:
      name: sapXep
      in: query
      schema: { type: string, enum: [MOI_NHAT, CU_NHAT, HAN_GAN_NHAT] }
    MaHoSo:
      name: maHoSo
      in: path
      required: true
      description: "Mã hồ sơ công khai, ví dụ MC-2026-000123"
      schema: { type: string, pattern: '^MC-\d{4}-\d{6}$' }
    Ma:
      name: ma
      in: path
      required: true
      description: "Mã nghiệp vụ (đọc được, unique). Backend cũng chấp nhận UUID nội bộ để tương thích ngược."
      schema: { type: string }
    MaSo:
      name: maSo
      in: path
      required: true
      description: "Mã số sinh viên/cán bộ (unique). Backend cũng chấp nhận UUID nội bộ để tương thích ngược."
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      description: "UUID nội bộ của tài nguyên"
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Khoá chống thực hiện trùng. Gửi lại đúng yêu cầu cũ cùng khoá sẽ nhận lại kết quả ban đầu; cùng khoá khác nội dung trả 409 DUPLICATE_ACTION."
      schema: { type: string, maxLength: 128 }
    ChallengeId:
      name: challengeId
      in: path
      required: true
      schema: { type: string }
    Token:
      name: token
      in: path
      required: true
      description: "Token xác thực, tối thiểu 128 bit"
      schema: { type: string, minLength: 22 }
    FileToken:
      name: fileToken
      in: path
      required: true
      description: "Token của liên kết tải có chữ ký"
      schema: { type: string }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string }
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: {}
    PaginatedEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: {} }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    PaginationMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
      description: "Frontend tự suy ra totalPages = ceil(total / pageSize)."
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: "Thông điệp tiếng Việt hiển thị cho người dùng" }
            details:
              type: object
              additionalProperties: true
              description: "Dữ liệu bổ sung tùy lỗi (soLanConLai, khoaDenLuc, giayToThieu, truongThieu...)"
    ErrorCode:
      type: string
      description: |
        Mã lỗi nghiệp vụ. Ánh xạ HTTP: UNAUTHORIZED 401, FORBIDDEN_SCOPE 403, NOT_FOUND 404,
        INVALID_TRANSITION 409, DUPLICATE_ACTION 409, ALREADY_PROCESSED 409,
        VALIDATION_ERROR 422, MISSING_ATTACHMENT 422, OTP_INVALID 400,
        OTP_EXPIRED 410, DOCUMENT_REVOKED 410, OTP_LOCKED 423.
      enum:
        - UNAUTHORIZED
        - FORBIDDEN_SCOPE
        - NOT_FOUND
        - VALIDATION_ERROR
        - INVALID_TRANSITION
        - DUPLICATE_ACTION
        - ALREADY_PROCESSED
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_LOCKED
        - MISSING_ATTACHMENT
        - DOCUMENT_REVOKED
        - NETWORK_ERROR
        - UNKNOWN
    Role:
      type: string
      enum: [SINH_VIEN, CO_VAN, TRUONG_KHOA, PHONG_DAO_TAO, ADMIN]
    UserStatus:
      type: string
      enum: [ACTIVE, LOCKED]
    Gender:
      type: string
      enum: [NAM, NU, KHAC]
    ApplicationStatus:
      type: string
      enum: [DRAFT, SUBMITTED, PENDING_APPROVAL, NEED_SUPPLEMENT, REJECTED, COMPLETED, CANCELLED]
    ApprovalMode:
      type: string
      enum: [ONE_CLICK, OTP]
    DocumentStatus:
      type: string
      enum: [VALID, REVOKED, INVALID]
    SignatureMethod:
      type: string
      enum: [OTP, ELECTRONIC]
    ApprovalActionType:
      type: string
      enum: [SUBMIT, APPROVE, REJECT, REQUEST_SUPPLEMENT, SUPPLEMENT, CANCEL, ISSUE_DOCUMENT, REVOKE_DOCUMENT]
    NotificationType:
      type: string
      enum: [INFO, SUCCESS, WARNING, DANGER]
    FieldType:
      type: string
      enum: [text, textarea, number, date, select, radio, checkbox, email, phone, upload]
    RequestTypeGroup:
      type: string
      enum:
        - "Giấy xác nhận & Bảng điểm"
        - "Học vụ & Thi cử"
        - "Nguyện vọng & Chuyển ngành"
        - "Tốt nghiệp & Bằng cấp"
    User:
      type: object
      required: [id, maSo, hoTen, email, role, trangThai]
      properties:
        id: { type: string, format: uuid, description: "UUID nội bộ" }
        maSo: { type: string, description: "Mã số sinh viên/cán bộ (unique)" }
        hoTen: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        avatarUrl: { type: string }
        soDienThoai: { type: string }
        ngaySinh: { type: string, format: date }
        gioiTinh: { $ref: '#/components/schemas/Gender' }
        chucVu: { type: string }
        donViId: { type: string, format: uuid }
        donViTen: { type: string }
        lopId: { type: string, format: uuid }
        lopTen: { type: string }
        nganhTen: { type: string }
        khoaHoc: { type: string }
        trangThai: { $ref: '#/components/schemas/UserStatus' }
    UserInput:
      type: object
      required: [maSo, hoTen, email, role, trangThai]
      properties:
        maSo: { type: string }
        hoTen: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        soDienThoai: { type: string }
        ngaySinh: { type: string, format: date }
        gioiTinh: { $ref: '#/components/schemas/Gender' }
        chucVu: { type: string }
        donViId: { type: string, format: uuid }
        lopId: { type: string, format: uuid }
        trangThai: { $ref: '#/components/schemas/UserStatus' }
    LoginPayload:
      type: object
      required: [dinhDanh, matKhau]
      properties:
        dinhDanh: { type: string, description: "Mã số hoặc email" }
        matKhau: { type: string, format: password, minLength: 6 }
    Session:
      type: object
      required: [token, user, hetHan]
      properties:
        token: { type: string, description: "Access token JWT (15 phút)" }
        user: { $ref: '#/components/schemas/User' }
        hetHan: { type: string, format: date-time }
    SessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties: { data: { $ref: '#/components/schemas/Session' } }
    StudentSummary:
      type: object
      required: [id, maSo, hoTen, lop, khoa, nganh, khoaHoc, email]
      properties:
        id: { type: string, format: uuid }
        maSo: { type: string }
        hoTen: { type: string }
        lop: { type: string }
        khoa: { type: string }
        nganh: { type: string }
        khoaHoc: { type: string }
        email: { type: string, format: email }
        soDienThoai: { type: string }
        coVanId: { type: string, format: uuid }
        coVanTen: { type: string }
    Attachment:
      type: object
      required: [id, ten, loai, kichThuoc, url, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        ten: { type: string }
        loai: { type: string, description: "MIME type" }
        kichThuoc: { type: integer, description: "Bytes" }
        url: { type: string, description: "Liên kết tải ngắn hạn (không công khai trực tiếp)" }
        uploadedAt: { type: string, format: date-time }
        nguoiTaiLen: { type: string }
        requirementKey: { type: string, description: "Khớp AttachmentRequirement.key nếu là giấy tờ bắt buộc" }
    SupplementRequest:
      type: object
      required: [noiDung, boiAiId, boiAiTen, luc, daBoSung, quayVeBuocOrder]
      properties:
        noiDung: { type: string }
        boiAiId: { type: string, format: uuid }
        boiAiTen: { type: string }
        luc: { type: string, format: date-time }
        daBoSung: { type: boolean }
        quayVeBuocOrder: { type: integer, description: "Bước đã yêu cầu bổ sung" }
    ApprovalAction:
      type: object
      required: [id, applicationId, buocOrder, hanhDong, nguoiThucHienId, nguoiThucHienTen, vaiTro, luc]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        buocOrder: { type: integer, description: "0 = do sinh viên thực hiện" }
        hanhDong: { $ref: '#/components/schemas/ApprovalActionType' }
        nguoiThucHienId: { type: string, format: uuid }
        nguoiThucHienTen: { type: string }
        chucVu: { type: string }
        vaiTro: { $ref: '#/components/schemas/Role' }
        ghiChu: { type: string }
        lyDo: { type: string }
        phuongThuc: { $ref: '#/components/schemas/ApprovalMode' }
        luc: { type: string, format: date-time }
        signatureId: { type: string, format: uuid }
    Signature:
      type: object
      required: [id, applicationId, buocOrder, tenBuoc, nguoiKyId, hoTen, chucVu, vaiTro, phuongThuc, thoiDiemKy, maBam, maChuKy, hopLe]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        vanBanId: { type: string, format: uuid }
        buocOrder: { type: integer }
        tenBuoc: { type: string }
        nguoiKyId: { type: string, format: uuid }
        hoTen: { type: string }
        chucVu: { type: string }
        vaiTro: { $ref: '#/components/schemas/Role' }
        phuongThuc: { $ref: '#/components/schemas/SignatureMethod' }
        thoiDiemKy: { type: string, format: date-time }
        maBam: { type: string, description: "SHA-256 nội dung hồ sơ tại thời điểm ký" }
        maChuKy: { type: string, description: "8 ký tự đầu của mã băm" }
        hopLe: { type: boolean }
        lyDoKhongHopLe: { type: string }
    Application:
      type: object
      required: [id, maHoSo, requestTypeId, requestType, sinhVienId, sinhVien, trangThai, duLieu, tepDinhKem, workflowId, currentStepOrder, tongSoBuoc, buocDaDuyet, lichSu, ngayTao, ngayCapNhat]
      properties:
        id: { type: string, format: uuid, description: "UUID nội bộ" }
        maHoSo: { type: string, description: "Mã hồ sơ công khai, dùng cho route /don/:ma" }
        requestTypeId: { type: string, format: uuid }
        requestType:
          type: object
          properties:
            id: { type: string, format: uuid }
            ma: { type: string }
            ten: { type: string }
            nhom: { type: string }
            icon: { type: string }
            mau: { type: string }
        sinhVienId: { type: string, format: uuid }
        sinhVien: { $ref: '#/components/schemas/StudentSummary' }
        trangThai: { $ref: '#/components/schemas/ApplicationStatus' }
        duLieu: { type: object, additionalProperties: true, description: "Snapshot dữ liệu biểu mẫu (JSONB)" }
        tepDinhKem:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        workflowId: { type: string, format: uuid }
        currentStepOrder: { type: integer }
        buocHienTai: { oneOf: [{ $ref: '#/components/schemas/WorkflowStep' }, { type: 'null' }] }
        tongSoBuoc: { type: integer }
        buocDaDuyet: { type: integer }
        lichSu:
          type: array
          items: { $ref: '#/components/schemas/ApprovalAction' }
        ngayTao: { type: string, format: date-time }
        ngayNop: { type: string, format: date-time }
        ngayCapNhat: { type: string, format: date-time }
        hanXuLy: { type: string, format: date-time }
        ngayHoanThanh: { type: string, format: date-time }
        lyDoTuChoi: { type: string }
        yeuCauBoSung: { $ref: '#/components/schemas/SupplementRequest' }
        vanBanId: { type: string, format: uuid }
        tokenXacThuc: { type: string }
        soVanBan: { type: string }
    ApplicationDetail:
      allOf:
        - $ref: '#/components/schemas/Application'
        - type: object
          required: [workflow, requestTypeFull]
          properties:
            workflow: { $ref: '#/components/schemas/Workflow' }
            requestTypeFull: { $ref: '#/components/schemas/RequestType' }
    CreateApplicationPayload:
      type: object
      required: [requestTypeId, duLieu, tepDinhKem]
      properties:
        requestTypeId: { type: string, format: uuid }
        duLieu: { type: object, additionalProperties: true }
        tepDinhKem:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
    SupplementInput:
      type: object
      properties:
        duLieu: { type: object, additionalProperties: true }
        tepDinhKem:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        ghiChu: { type: string, maxLength: 2000 }
    ApproveInput:
      type: object
      required: [maHoSo]
      properties:
        maHoSo: { type: string }
        ghiChu: { type: string, maxLength: 2000 }
        challengeId: { type: string, description: "Bắt buộc khi bước ở chế độ OTP" }
        otp: { type: string, pattern: '^\d{6}$', description: "Bắt buộc khi bước ở chế độ OTP" }
    BatchApproveResult:
      type: object
      required: [thanhCong, thatBai]
      properties:
        thanhCong:
          type: array
          items: { type: string }
        thatBai:
          type: array
          items:
            type: object
            required: [maHoSo, maLoi, lyDo]
            properties:
              maHoSo: { type: string }
              maLoi: { type: string }
              lyDo: { type: string }
    MyStats:
      type: object
      required: [nhap, dangXuLy, canBoSung, hoanThanh, tong]
      properties:
        nhap: { type: integer }
        dangXuLy: { type: integer }
        canBoSung: { type: integer }
        hoanThanh: { type: integer }
        tong: { type: integer }
    ApprovalStats:
      type: object
      required: [choToiDuyet, sapHetHan, quaHan, daXuLyTuanNay, theoTrangThai, theoLoaiDon, theoKhoa, xuHuong7Ngay]
      properties:
        choToiDuyet: { type: integer }
        sapHetHan: { type: integer }
        quaHan: { type: integer }
        daXuLyTuanNay: { type: integer }
        theoTrangThai:
          type: array
          items:
            type: object
            required: [trangThai, nhan, soLuong]
            properties:
              trangThai: { $ref: '#/components/schemas/ApplicationStatus' }
              nhan: { type: string }
              soLuong: { type: integer }
        theoLoaiDon:
          type: array
          items:
            type: object
            properties:
              ten: { type: string }
              soLuong: { type: integer }
        theoKhoa:
          type: array
          items:
            type: object
            properties:
              ten: { type: string }
              soLuong: { type: integer }
        xuHuong7Ngay:
          type: array
          items:
            type: object
            required: [ngay, nop, duyet]
            properties:
              ngay: { type: string }
              nop: { type: integer }
              duyet: { type: integer }
    FieldOption:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
    FormField:
      type: object
      required: [id, key, label, type, required, order]
      properties:
        id: { type: string }
        key: { type: string }
        label: { type: string }
        type: { $ref: '#/components/schemas/FieldType' }
        placeholder: { type: string }
        helpText: { type: string }
        required: { type: boolean }
        options:
          type: array
          items: { $ref: '#/components/schemas/FieldOption' }
        defaultValue: {}
        min: { type: number }
        max: { type: number }
        rows: { type: integer }
        accept: { type: string }
        maxSizeMb: { type: number }
        width: { type: string, enum: [full, half] }
        order: { type: integer }
        readOnly: { type: boolean }
    AttachmentRequirement:
      type: object
      required: [key, label, batBuoc]
      properties:
        key: { type: string }
        label: { type: string }
        batBuoc: { type: boolean }
        accept: { type: string }
        helpText: { type: string }
    RequestType:
      type: object
      required: [id, ma, ten, nhom, moTa, icon, mau, formFields, giayTo, workflowId, templateId, soNgayXuLy, lePhi, hoatDong]
      properties:
        id: { type: string, format: uuid }
        ma: { type: string, description: "Mã nghiệp vụ unique, ví dụ GXN" }
        ten: { type: string }
        nhom: { $ref: '#/components/schemas/RequestTypeGroup' }
        moTa: { type: string }
        icon: { type: string, description: "Tên icon lucide-react" }
        mau: { type: string, enum: [brand, emerald, amber, violet, rose] }
        formFields:
          type: array
          items: { $ref: '#/components/schemas/FormField' }
        giayTo:
          type: array
          items: { $ref: '#/components/schemas/AttachmentRequirement' }
        workflowId: { type: string, format: uuid }
        workflowMa: { type: string, description: "Mã luồng duyệt - dùng dựng URL /workflows/{ma}" }
        templateId: { type: string, format: uuid }
        templateMa: { type: string, description: "Mã mẫu văn bản - dùng dựng URL /templates/{ma}" }
        soNgayXuLy: { type: integer }
        lePhi: { type: integer, description: "VNĐ, 0 = miễn phí" }
        hoatDong: { type: boolean }
        soLuotNop: { type: integer }
    RequestTypeInput:
      type: object
      required: [ma, ten, nhom, moTa, icon, mau, formFields, giayTo, workflowId, templateId, soNgayXuLy, lePhi, hoatDong]
      properties:
        ma: { type: string }
        ten: { type: string }
        nhom: { $ref: '#/components/schemas/RequestTypeGroup' }
        moTa: { type: string }
        icon: { type: string }
        mau: { type: string, enum: [brand, emerald, amber, violet, rose] }
        formFields:
          type: array
          items: { $ref: '#/components/schemas/FormField' }
        giayTo:
          type: array
          items: { $ref: '#/components/schemas/AttachmentRequirement' }
        workflowId: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        soNgayXuLy: { type: integer }
        lePhi: { type: integer }
        hoatDong: { type: boolean }
    RequestTypeStat:
      type: object
      required: [requestTypeId, ten, ma, soLuong]
      properties:
        requestTypeId: { type: string, format: uuid }
        ten: { type: string }
        ma: { type: string }
        soLuong: { type: integer }
    WorkflowStep:
      type: object
      required: [id, order, ten, role, mode, slaHours, allowReject, allowSupplement]
      properties:
        id: { type: string, format: uuid }
        order: { type: integer, minimum: 1 }
        ten: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        mode: { $ref: '#/components/schemas/ApprovalMode' }
        slaHours: { type: integer, minimum: 1 }
        allowReject: { type: boolean }
        allowSupplement: { type: boolean }
        moTa: { type: string }
    Workflow:
      type: object
      required: [id, ma, ten, requestTypeIds, steps, hoatDong, capDo]
      properties:
        id: { type: string, format: uuid }
        ma: { type: string, description: "Mã nghiệp vụ unique, ví dụ WF-01" }
        ten: { type: string }
        requestTypeIds:
          type: array
          items: { type: string, format: uuid }
        requestTypeMas:
          type: array
          items: { type: string }
          description: "Mã các loại đơn áp dụng - dùng dựng URL /request-types/{ma}"
        steps:
          type: array
          items: { $ref: '#/components/schemas/WorkflowStep' }
        hoatDong: { type: boolean }
        capDo: { type: integer, enum: [1, 2, 3] }
    WorkflowInput:
      type: object
      required: [ma, ten, steps, hoatDong]
      properties:
        ma: { type: string }
        ten: { type: string }
        requestTypeIds:
          type: array
          items: { type: string, format: uuid }
        steps:
          type: array
          items: { $ref: '#/components/schemas/WorkflowStep' }
        hoatDong: { type: boolean }
    WorkflowValidation:
      type: object
      required: [hopLe, canhBao]
      properties:
        hopLe: { type: boolean }
        canhBao:
          type: array
          items: { type: string }
    DocumentTemplate:
      type: object
      required: [id, ma, ten, loaiVanBan, noiDung, hoatDong, capNhatLuc]
      properties:
        id: { type: string, format: uuid }
        ma: { type: string, description: "Mã nghiệp vụ unique, ví dụ MVT-GXN" }
        ten: { type: string }
        loaiVanBan: { type: string }
        noiDung: { type: string, description: "Nội dung có biến dạng {{ho_ten}}, {{mssv}}, {{so_van_ban}}..." }
        hoatDong: { type: boolean }
        capNhatLuc: { type: string, format: date-time }
    DocumentTemplateInput:
      type: object
      required: [ma, ten, loaiVanBan, noiDung, hoatDong]
      properties:
        ma: { type: string }
        ten: { type: string }
        loaiVanBan: { type: string }
        noiDung: { type: string }
        hoatDong: { type: boolean }
    DocumentDownloadLog:
      type: object
      required: [id, luc, nguoiTai, diaChiIp]
      properties:
        id: { type: string, format: uuid }
        luc: { type: string, format: date-time }
        nguoiTai: { type: string }
        diaChiIp: { type: string }
    SignedDocument:
      type: object
      required: [id, soVanBan, trichYeu, loaiVanBan, templateId, applicationId, maHoSo, sinhVien, noiDung, ngayCap, tokenXacThuc, maBamSha256, chuKy, trangThai, chuKyConHieuLuc, luotTai]
      properties:
        id: { type: string, format: uuid }
        soVanBan: { type: string, description: "Số văn bản, ví dụ 132/GXN-DHTB" }
        trichYeu: { type: string }
        loaiVanBan: { type: string }
        templateId: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        maHoSo: { type: string }
        sinhVien:
          type: object
          required: [hoTen, mssv, lop, khoa, nganh, khoaHoc]
          properties:
            hoTen: { type: string }
            mssv: { type: string }
            lop: { type: string }
            khoa: { type: string }
            nganh: { type: string }
            khoaHoc: { type: string }
        noiDung: { type: string, description: "HTML nội dung A4" }
        ngayCap: { type: string, format: date-time }
        tokenXacThuc: { type: string, description: "Token dùng cho đường dẫn /xac-thuc/:token, tối thiểu 128 bit" }
        maBamSha256: { type: string, pattern: '^[a-f0-9]{64}$', description: "SHA-256 của tệp PDF nhị phân" }
        chuKy:
          type: array
          items: { $ref: '#/components/schemas/Signature' }
        trangThai: { $ref: '#/components/schemas/DocumentStatus' }
        chuKyConHieuLuc: { type: boolean }
        lyDoThuHoi: { type: string }
        ngayThuHoi: { type: string, format: date-time }
        luotTai:
          type: array
          items: { $ref: '#/components/schemas/DocumentDownloadLog' }
    PublicSignedDocument:
      description: "Văn bản công khai - họ tên và MSSV ĐÃ ĐƯỢC CHE Ở MÁY CHỦ (ví dụ \"Nguyễn V** A\", \"2021***\"). Không kèm id nội bộ, applicationId, maHoSo, noiDung HTML, lịch sử tải, email hay số điện thoại."
      type: object
